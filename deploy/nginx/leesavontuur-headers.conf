# LEESAVONTUUR – nginx hardening-headers (SEC-R2-003)
#
# Voeg deze regels toe aan het server/location-blok dat de productiebuild
# serveert. `always` zorgt dat de headers ook bij foutresponsen meekomen.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; media-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
